name: Build & Release Linux Deploy Package

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 发布 Release 需要写权限

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史以生成版本号
          persist-credentials: false # 不把 GITHUB_TOKEN 写进 .git/config，避免依赖安装脚本读取

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (production only)
        run: npm ci --omit=dev --ignore-scripts

      - name: Generate version number
        id: ver
        run: |
          # 版本号 = package.json 版本 + 构建序号 + 短 commit
          PKG_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y%m%d)
          TAG="v${PKG_VERSION}-build.${GITHUB_RUN_NUMBER}"
          FULL_VERSION="${PKG_VERSION}-build.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          echo "tag=${TAG}"                 >> "$GITHUB_OUTPUT"
          echo "full_version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${PKG_VERSION}"  >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"      >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}"    >> "$GITHUB_OUTPUT"
          echo "构建版本: ${TAG} (${FULL_VERSION})"

      - name: Create deploy directory
        run: mkdir -p deploy-package

      - name: Copy Linux deployment files
        run: |
          # 核心服务文件
          cp server.js deploy-package/
          cp package.json deploy-package/
          cp package-lock.json deploy-package/
          cp .env.example deploy-package/ 2>/dev/null || true
          cp API.md deploy-package/ 2>/dev/null || true
          cp DeploymentGuide.md deploy-package/ 2>/dev/null || true
          cp README.md deploy-package/ 2>/dev/null || true

          # Linux 部署脚本与容器编排
          cp deploy.sh deploy-package/
          cp setup.sh deploy-package/
          cp start.sh deploy-package/
          cp uninstall.sh deploy-package/ 2>/dev/null || true
          cp docker-compose.yml deploy-package/ 2>/dev/null || true

          # 源码目录
          cp -r src deploy-package/

          # 前端静态文件
          cp -r public deploy-package/

          # 数据目录（空模板）
          mkdir -p deploy-package/data

          # node_modules（生产依赖）
          cp -r node_modules deploy-package/

          chmod +x deploy-package/*.sh

      - name: Exclude non-Linux files
        run: |
          rm -f deploy-package/*.bat
          rm -rf deploy-package/android
          rm -rf deploy-package/Redis
          rm -rf deploy-package/node_modules/.cache
          rm -rf deploy-package/.github
          rm -rf deploy-package/.workbuddy

      - name: Write VERSION file
        run: |
          cat > deploy-package/VERSION <<EOF
          VERSION=${{ steps.ver.outputs.full_version }}
          TAG=${{ steps.ver.outputs.tag }}
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT=${{ steps.ver.outputs.short_sha }}
          NODE_VERSION=$(node -v)
          EOF
          echo "----- VERSION -----"
          cat deploy-package/VERSION

      - name: Create tar.gz archive
        run: |
          cd deploy-package
          # 归档名固定，便于 install.sh 用 releases/latest/download 直接拿最新包
          tar -czf ../school-forum-linux-deploy.tar.gz .
          cd ..
          ls -lh school-forum-linux-deploy.tar.gz

      - name: Compute checksum
        run: |
          sha256sum school-forum-linux-deploy.tar.gz > school-forum-linux-deploy.tar.gz.sha256
          cat school-forum-linux-deploy.tar.gz.sha256

      - name: Upload build artifact (备份，30 天)
        uses: actions/upload-artifact@v4
        with:
          name: school-forum-linux-deploy-${{ steps.ver.outputs.tag }}
          path: |
            school-forum-linux-deploy.tar.gz
            school-forum-linux-deploy.tar.gz.sha256
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 校园论坛部署包 ${{ steps.ver.outputs.tag }}
          body: |
            ## 🎓 校园论坛系统 · Linux 部署包 `${{ steps.ver.outputs.tag }}`

            > 📌 **本包为最新构建版本**，`releases/latest` 始终指向这里。老用户可直接用下方 `update` 命令一键升级（自动保留 `.env` 与 `data/config.json`）。

            ---

            ### 🚀 一键安装（推荐）
            在目标 Linux 服务器上直接执行：
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
            ```
            > ⚠️ 前置依赖：该命令需要系统已安装 **curl**。最小化系统 / 容器 / Alpine 可能没有，请先安装：
            > `sudo apt install -y curl`（Debian/Ubuntu）· `sudo yum install -y curl`（CentOS/RHEL）· `apk add curl`（Alpine）

            ### 🔄 检查更新 / 升级到本版本
            ```bash
            bash install.sh check     # 检查是否有新版本
            bash install.sh update    # 升级并保留现有配置（.env / data/config.json）
            ```

            ### 📦 手动部署
            下载下方 `school-forum-linux-deploy.tar.gz`，解压后运行 `./deploy.sh`：
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/school-forum-linux-deploy.tar.gz -o school-forum.tar.gz
            tar -xzf school-forum.tar.gz && ./deploy.sh
            ```

            ### 🔐 校验完整性（可选）
            ```bash
            sha256sum -c school-forum-linux-deploy.tar.gz.sha256
            ```

            ### 🛠 安装常见问题（Troubleshooting）

            若安装命令报 `curl: (60) SSL certificate problem: unable to get local issuer certificate`，常见两类原因：

            **情况 A：精简 Linux 镜像未预装 CA 证书包**（如部分 WSL rootfs、Docker 基础镜像）
            普通完整版 Ubuntu Server 默认已含该包，一般无需处理：
            ```bash
            sudo apt-get update && sudo apt-get install -y ca-certificates
            ```

            **情况 B（更常见）：本机存在 TLS 拦截代理 / 加速器（如 SteamTools、各类游戏加速器、公司网关）**
            这类软件会把 `github.com` 的证书用**自己的根 CA 重新签名**，而该根 CA 通常只装进了 Windows 证书库、未装进 WSL / 容器的独立证书库，于是 curl 报 "unknown CA"。
            先用下面命令确认（看 `issuer` 是否为你本机软件的 CA，而非 DigiCert / GlobalSign 等正规 CA）：
            ```bash
            echo | openssl s_client -connect github.com:443 2>/dev/null | openssl x509 -noout -issuer
            ```
            **一次性修复：把该代理根 CA 加入 WSL 信任库**（抓取并信任，以 SteamTools 为例）：
            ```bash
            sudo mkdir -p /usr/local/share/ca-certificates
            echo | openssl s_client -showcerts -connect github.com:443 2>/dev/null \
              | sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' \
              | awk 'BEGIN{c=0} /BEGIN CERTIFICATE/{c++} c>=2{print}' \
              > /usr/local/share/ca-certificates/local-proxy-ca.crt
            sudo update-ca-certificates
            # 之后无需 -k 即可正常安装：
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
            ```
            **临时绕过（仅在你信任当前网络时）：** `curl -k ... | bash` 跳过证书校验，但每次都需加 `-k`，不建议长期使用。

            **通用备用方案：**
            - 若 `apt-get update` 本身也报 SSL 错误（软件源被切成 HTTPS 镜像），先临时切回 HTTP 再装证书：
              ```bash
              sudo sed -i 's|https://|http://|g' /etc/apt/sources.list /etc/apt/sources.list.d/*
              sudo apt-get update && sudo apt-get install -y ca-certificates
              ```
            - 若系统时间明显错误（如 1970 年）：TLS 会因时钟漂移失败，先校时：
              ```bash
              sudo ntpdate -u time.windows.com   # 或 sudo hwclock -s
              date   # 应显示正确年份，如 2026
              ```

            ---

            ### 📋 构建信息
            | 项 | 值 |
            |---|---|
            | 构建版本 | `${{ steps.ver.outputs.full_version }}` |
            | 基础版本 | `${{ steps.ver.outputs.pkg_version }}` |
            | 构建序号 | `${{ github.run_number }}` |
            | Commit | `${{ steps.ver.outputs.short_sha }}` |
            | 构建时间 | `${{ steps.ver.outputs.build_date }}` |

            > 产物已包含生产依赖（node_modules）、部署脚本与 docker-compose.yml，开箱即用；CPU 无 AVX2 时自动走 Docker 跑 MongoDB 4.4。
          files: |
            school-forum-linux-deploy.tar.gz
            school-forum-linux-deploy.tar.gz.sha256
            install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
