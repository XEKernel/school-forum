# 校园论坛 school-forum 的 MongoDB 4.4 服务
# 背景：CPU 不支持 AVX2，且 Ubuntu 24.04 无法原生安装 4.4，
#       因此用容器跑官方 mongo:4.4 镜像（基于 Debian，自带 libssl1.1，无需 AVX2）。
# 项目连接串保持 mongodb://localhost:27017 不变即可，零代码改动。
#
# 启动：在 WSL 里  cd ~/project/school-forum  &&  docker compose up -d
# 停止：docker compose down            （数据保留在命名卷 mongodb44-data 中）
# 查看日志：docker compose logs -f mongodb
#
# ⚠ 安全说明（部署到公网机器前请逐条确认）：
#   1. 端口只绑定到宿主机回环（127.0.0.1），外网无法直连 27017
#   2. mongod 已带 --auth：必须用 root 账号连接（创建/轮换命令见下方注释），
#      应用侧凭据写在 .env 的 MONGODB_USERNAME / MONGODB_PASSWORD / MONGODB_AUTHSOURCE
#   3. Redis 不在本 compose 中：建议 /etc/redis/redis.conf 里
#      bind 127.0.0.1 -::1 + protected-mode yes + requirepass，并在 .env 设置 REDIS_PASSWORD
#   4. 对外提供服务请跑在 TLS 终止之后（Nginx/Caddy 反代 HTTPS），Node 只监听回环；
#      同时在 后台 → 安全设置（data/config.json 的 security 段）把 allowHTTP 设为 false、
#      hstsEnabled 设为 true，并把 .env 的 CORS_ORIGIN 改成 https://你的域名

services:
  mongodb:
    image: mongo:4.4
    container_name: mongodb44
    restart: unless-stopped
    ports:
      # 仅绑定宿主机回环：容器内端口不改，端口发布限制在 127.0.0.1
      - "127.0.0.1:27017:27017"
    volumes:
      # 用命名卷而非绑定目录，规避 WSL 权限/9P 性能问题，数据持久化且高性能
      - mongodb44-data:/data/db
    # 限制 WiredTiger 内存占用，避免在你 8GB 的 WSL 里吃满内存；--auth 强制账号密码鉴权
    command: ["mongod", "--wiredTigerCacheSizeGB", "1.5", "--auth"]
    # 鉴权已启用：管理员账号 root（admin 库）由一次性命令创建（数据卷非空时
    # MONGO_INITDB_* 不会再生效，因此这里保持注释）：
    #   docker exec mongodb44 mongo admin --eval \
    #     "db.createUser({user:'root',pwd:'<强口令>',roles:[{role:'root',db:'admin'}]})"
    # 口令轮换：docker exec mongodb44 mongo admin --eval "db.changeUserPassword('root','<新口令>')"
    # 应用侧凭据在 .env 的 MONGODB_USERNAME / MONGODB_PASSWORD / MONGODB_AUTHSOURCE（600 权限）
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: root
    #   MONGO_INITDB_ROOT_PASSWORD: 你的密码

volumes:
  mongodb44-data:
    driver: local
