<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2b6cb0">
  <title>黑名单 - 校园论坛</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/m-app.css">
</head>
<body>
  <header class="m-appbar">
    <button class="m-iconbtn m-back" id="m-back" aria-label="返回"><i class="fas fa-chevron-left"></i></button>
    <div class="m-appbar-title">黑名单</div>
    <span class="m-row-value" id="m-count"></span>
  </header>

  <main class="m-content m-no-fab">
    <p class="m-hint" style="margin:2px 4px 12px">
      被拉黑的用户无法关注你、给你发私信，其帖子与评论也会对你隐藏（可在隐私设置中调整）。
    </p>
    <div id="m-list"></div>
    <div class="m-loadmore" id="m-more" style="display:none">上拉加载更多</div>
  </main>

  <script defer src="/js/m-app.js"></script>
  <script defer src="/js/m-blacklist.js"></script>
</body>
</html>
