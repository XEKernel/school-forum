<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2b6cb0">
  <title>找回密码 - 校园论坛</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/m-app.css">
</head>
<body>
  <header class="m-appbar">
    <button class="m-iconbtn m-back" id="m-back" aria-label="返回"><i class="fas fa-chevron-left"></i></button>
    <div class="m-appbar-title">找回密码</div>
  </header>

  <main class="m-content m-no-fab">
    <form class="m-form" id="m-form" autocomplete="off" novalidate>
      <p class="m-hint" style="margin-bottom:14px">
        输入注册时使用的邮箱和 QQ 号，验证通过后可设置新密码。
      </p>

      <div class="m-field">
        <label class="m-label">QQ号</label>
        <input class="m-input" id="fg-qq" inputmode="numeric" placeholder="注册时填写的QQ号">
      </div>
      <div class="m-field">
        <label class="m-label">邮箱</label>
        <input class="m-input" id="fg-email" type="email" placeholder="注册邮箱">
      </div>
      <div class="m-field">
        <label class="m-label">图形验证码</label>
        <div class="m-captcha">
          <img id="fg-captcha-img" alt="图形验证码" title="点击刷新">
          <input class="m-input" id="fg-captcha-code" placeholder="输入图中字符" maxlength="6">
        </div>
      </div>
      <div class="m-field">
        <label class="m-label">邮箱验证码</label>
        <div class="m-row-inline">
          <input class="m-input" id="fg-code" inputmode="numeric" placeholder="6 位验证码" maxlength="8">
          <button type="button" class="m-btn m-btn-ghost m-btn-sm" id="fg-send">获取验证码</button>
        </div>
      </div>
      <div class="m-field">
        <label class="m-label">新密码</label>
        <input class="m-input" id="fg-password" type="password" placeholder="至少 8 位，含大小写字母和数字">
      </div>

      <button type="submit" class="m-btn m-btn-primary m-btn-block" id="fg-submit" style="margin-top:16px">
        重置密码
      </button>
      <div class="m-form-foot"><span class="m-link" id="fg-back-login">返回登录</span></div>
    </form>
  </main>

  <script defer src="/js/m-app.js"></script>
  <script defer src="/js/m-forgot.js"></script>
</body>
</html>
