<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2b6cb0">
  <title>消息 - 校园论坛</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/m-app.css">
</head>
<body>
  <header class="m-appbar">
    <div class="m-appbar-title">消息</div>
    <button class="m-iconbtn" id="m-readall-btn" aria-label="全部已读" title="全部标记为已读">
      <i class="fas fa-check-double"></i>
    </button>
  </header>

  <main class="m-content m-no-fab" id="m-content">
    <div class="m-seg" id="m-seg">
      <button data-type="" class="active">全部</button>
      <button data-type="like">点赞</button>
      <button data-type="comment">评论</button>
      <button data-type="follow">关注</button>
      <button data-type="system">系统</button>
    </div>
    <div id="m-notes"></div>
  </main>

  <script defer src="/js/m-app.js"></script>
  <script src="/js/m-msg.js" defer></script>
</body>
</html>
