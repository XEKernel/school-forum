<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2b6cb0">
  <title>帖子 - 校园论坛</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/m-app.css">
  <link rel="stylesheet" href="/libs/highlight.js/styles/github-dark.min.css">
  <script defer src="/libs/markdown-it/markdown-it.min.js"></script>
  <script src="/libs/highlight.js/highlight.min.js"></script>
  <script src="/js/mathjax-full.js"></script>
  <script id="MathJax-script" src="/libs/mathjax/tex-svg-full.js"></script>
</head>
<body>
  <header class="m-appbar">
    <button class="m-iconbtn m-back" id="m-back" aria-label="返回"><i class="fas fa-chevron-left"></i></button>
    <div class="m-appbar-title">帖子详情</div>
    <button class="m-iconbtn" id="m-share" aria-label="分享"><i class="fas fa-share-nodes"></i></button>
  </header>

  <main class="m-content m-has-cmtbar" id="m-content">
    <div id="m-post-host"></div>
    <div class="m-section-title" id="m-cmt-title" style="display:none">
      <span><i class="fas fa-comment-dots"></i>评论 <b id="m-cmt-count">0</b></span>
    </div>
    <div id="m-cmt-host"></div>
  </main>

  <div class="m-cmtbar">
    <textarea id="m-cmt-input" rows="1" placeholder="说点什么…"></textarea>
    <button class="m-send" id="m-cmt-send" aria-label="发送"><i class="fas fa-paper-plane"></i></button>
  </div>

  <script defer src="/js/m-app.js"></script>
  <script defer src="/js/m-post.js"></script>
</body>
</html>
