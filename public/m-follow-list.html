<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2b6cb0">
  <title>关注/粉丝 - 校园论坛</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/m-app.css">
</head>
<body>
  <header class="m-appbar">
    <button class="m-iconbtn m-back" id="m-back" aria-label="返回"><i class="fas fa-chevron-left"></i></button>
    <div class="m-appbar-title">关注 / 粉丝</div>
  </header>

  <main class="m-content m-no-fab">
    <div class="m-seg" id="m-seg">
      <button data-type="following" class="active">我的关注</button>
      <button data-type="followers">我的粉丝</button>
    </div>
    <div id="m-list"></div>
    <div class="m-loadmore" id="m-more" style="display:none">上拉加载更多</div>
  </main>

  <script defer src="/js/m-app.js"></script>
  <script defer src="/js/m-flist.js"></script>
</body>
</html>
